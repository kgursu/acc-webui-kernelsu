name: Build and Release

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.github/**'
      - 'README.html'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version info
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          # zip name carries the versionCode in parentheses, e.g. acc-webui_v1.1-test1_(1).zip
          ZIP_NAME="acc-webui_${VERSION}.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          # Prerelease when the version name contains test/beta/pre/rc/alpha
          case "$VERSION" in
            *test*|*beta*|*pre*|*rc*|*alpha*)
              echo "is_prerelease=true" >> $GITHUB_OUTPUT ;;
            *)
              echo "is_prerelease=false" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build uninstaller zip
        run: |
          mkdir -p bin .tmp/META-INF/com/google/android
          sed 's|#!/system/bin/sh|#!/sbin/sh|' install/uninstall.sh > .tmp/META-INF/com/google/android/update-binary
          echo "#MAGISK" > .tmp/META-INF/com/google/android/updater-script
          cd .tmp && zip -r9 ../bin/acc_flashable_uninstaller.zip * && cd ..
          rm -rf .tmp

      - name: Sync installer scripts
        run: |
          cp customize.sh install.sh
          cp customize.sh META-INF/com/google/android/update-binary

      - name: Cache-bust WebUI assets
        run: |
          VC="${{ steps.version.outputs.version_code }}"
          sed -i -E "s|(href=\"style.css)(\?v=[0-9]+)?\"|\1?v=${VC}\"|" install/webroot/index.html
          sed -i -E "s|(src=\"script.js)(\?v=[0-9]+)?\"|\1?v=${VC}\"|" install/webroot/index.html
          sed -i -E "s|(src=\"config.js)(\?v=[0-9]+)?\"|\1?v=${VC}\"|" install/webroot/index.html

      - name: Build flashable zip
        run: |
          zip -r9 "${{ steps.version.outputs.zip_name }}" \
            META-INF bin install module.prop module.json module-beta.json \
            customize.sh install.sh install-online.sh install-tarball.sh \
            License.md README.md README.html changelog.md

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "${{ steps.version.outputs.version }}"
          body: |
            ## Changes
            See [changelog](https://github.com/${{ github.repository }}/blob/dev/changelog.md) for details.

            ## Supported Root Frameworks
            - Magisk
            - KernelSU
            - APatch
            - FolkPatch
          files: ${{ steps.version.outputs.zip_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
